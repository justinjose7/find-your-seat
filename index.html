<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F2E5C">
<meta name="color-scheme" content="light">
<title>Find your seat · Mathews &amp; Swaroopa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2F2E5C; --cream:#FBF7F1; --canvas:#EFE9DF; --sand:#F3EDE3; --sand-deep:#E4D9C6;
  --gold:#B08748; --gold-dark:#96702C; --gold-light:#D9BE8B; --gold-light-2:#E7CFA0;
  --body:#514D63; --label:#6E6A7C; --muted:#514D63; --muted-light:#514D63; --ph:#6E6A7C;
  --hair:rgba(47,46,92,.16); --hair-2:rgba(47,46,92,.16); --hair-3:rgba(47,46,92,.18); --hair-4:rgba(47,46,92,.2); --hair-5:rgba(47,46,92,.28);
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ui:Jost,'Avenir Next','Helvetica Neue',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;min-height:100dvh;background:var(--cream);color:var(--ink);font-family:var(--ui);font-weight:400;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{position:relative;flex:1;display:flex;flex-direction:column;width:100%;margin:0 auto;min-height:100dvh}
@media (min-width:481px){.app,.sheet .panel{max-width:420px}}
body.ink,body.ink1{background:var(--ink)}
/* wide screens: the column is capped at 420px, the body stays cream (the ink body only matters for Safari's bars on
   phones), and the header band paints edge to edge behind the column */
@media (min-width:481px){
  body.ink1{background:var(--cream)}
  html{overflow-x:clip}
  .band{position:relative;isolation:isolate}
  .band::before{content:'';position:absolute;top:0;bottom:0;left:-50vw;right:-50vw;background:var(--ink);z-index:-1}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s ease-out;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.on{opacity:1;pointer-events:auto;position:relative;flex:1}
.eyebrow{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dark)}
.label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.display{font-family:var(--display);font-weight:400}

/* 1 · welcome */
#s1{padding-top:0;background:var(--cream)}
.band{background:var(--ink);color:var(--cream);padding:calc(16px + env(safe-area-inset-top)) 26px 30px;display:flex;flex-direction:column}
.hdr{padding-top:26px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.hdr .eyebrow{color:var(--gold-light-2)}
.hdr .names{font-family:var(--display);font-size:34px;line-height:1.1;color:var(--cream);white-space:nowrap;max-width:100%}
.hdr .rule{width:48px;height:1px;background:var(--gold-light);margin-top:12px}
.lead{padding:32px 28px 0;display:flex;flex-direction:column;gap:12px}
.lead h1{display:flex;flex-direction:column;gap:2px;font-weight:400}
.lead h1 em{font-family:var(--display);font-style:italic;font-size:25px;line-height:1.2;color:var(--gold-dark)}
.lead h1 span{font-family:var(--display);font-size:41px;line-height:1.08;letter-spacing:-.012em;color:var(--ink)}
.lead p{font-size:19px;line-height:1.5;color:var(--body)}
.field-wrap{padding:26px 28px 0}
.field{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--hair-5);border-radius:16px;padding:21px 18px;box-shadow:0 2px 10px rgba(47,46,92,.05);transition:border-color .15s}
.field:focus-within{border:2px solid var(--gold-dark);padding:20.5px 17.5px}
.field .dot{width:17px;height:17px;border:2px solid var(--gold-dark);border-radius:50%;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:21px;line-height:1.2;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ph)}
.field input::-webkit-search-cancel-button,.field input::-webkit-search-decoration{-webkit-appearance:none}
.field .clear{width:32px;height:32px;margin:-6px -10px -6px 0;border-radius:50%;color:var(--label);font-size:22px;line-height:1;display:none;align-items:center;justify-content:center}
.field.has .clear{display:flex}
#s1 .field{border:2px solid var(--ink);padding:20.5px 17.5px;box-shadow:none}
#s1 .field:focus-within{border-color:var(--ink)}
#s1 .field input{font-size:20px}
#s1 .field input::placeholder{color:var(--body)}
#s1 .field input:focus::placeholder{color:transparent}
.foot{margin-top:auto;padding:22px 24px 26px;font-size:18px;line-height:1.45;color:var(--body);text-align:center}

/* 2 · matches */
#s2 .field-wrap{padding:22px 24px 0}
#s2 .field{border:2px solid var(--gold-dark);padding:20.5px 17.5px}
.results{padding:22px 24px 0;display:flex;flex-direction:column;gap:0}
.results .label{margin-bottom:12px}
.best{background:#fff;border-radius:22px;padding:20px;display:flex;align-items:center;gap:18px;box-shadow:0 6px 20px rgba(47,46,92,.08);text-align:left;width:100%}
.best:active{transform:scale(.99)}
.best .tile{width:74px;height:74px;border-radius:20px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;flex:none}
.best .tile.s{font-size:34px}
.best .txt{min-width:0}
.best .nm{font-family:var(--display);font-size:26px;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best .sub{font-size:18px;color:var(--body);margin-top:4px}
.alts{padding:26px 24px 0;display:flex;flex-direction:column}
.alts .label{margin-bottom:8px}
.alt{display:flex;align-items:center;gap:18px;padding:17px 4px;border-bottom:1px solid var(--hair);text-align:left;width:100%}
.alt:last-child{border-bottom:0}
.alt .n{width:40px;text-align:center;font-family:var(--display);font-size:32px;line-height:1;color:var(--gold-dark);font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;flex:none}
.alt .nm{font-size:21px;color:var(--ink)}
.empty{padding:28px 24px 0;font-size:19px;line-height:1.5;color:var(--body)}
.bottom{margin-top:auto;padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px}
.help{font-size:18px;line-height:1.45;color:var(--body);text-align:center}
.help[hidden]{display:none}
.cta{height:64px;background:var(--ink);color:var(--cream);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:21px;letter-spacing:.02em;width:100%}
.cta:active{opacity:.9}
.cta[hidden]{display:none}

/* 3 · your table */
#s3{background:var(--ink);color:var(--cream)}
#s3 .top{padding:24px 26px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#s3 .who{font-size:19px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#s3 .again{font-size:18px;color:var(--gold-light-2);padding:10px 0 10px 12px;margin:-10px 0;flex:none;min-height:44px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px calc(24px + env(safe-area-inset-bottom))}
.hero .eyebrow{color:var(--gold-light-2);letter-spacing:.28em;font-size:13px}
.num{font-family:var(--display);font-size:clamp(150px,58vw,196px);line-height:1.16;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;margin-top:8px;color:var(--cream);transform:scale(.94);opacity:0;transition:transform .22s ease-out,opacity .22s ease-out}
.num.s{font-size:clamp(48px,16vw,62px);font-style:italic;line-height:1.2;margin:26px 0 18px}
.on .num{transform:scale(1);opacity:1}
.pill{height:62px;padding:0 30px;border:1.5px solid var(--gold-light);background:var(--gold-light);color:var(--ink);border-radius:16px;font-size:20px;display:flex;align-items:center;justify-content:center;margin-top:20px}
.pill:active{background:var(--gold);border-color:var(--gold)}
.ghost{height:62px;padding:0 30px;border:1.5px solid rgba(251,247,241,.45);background:transparent;color:var(--cream);border-radius:16px;font-size:20px;display:flex;align-items:center;justify-content:center;margin-top:12px}
.ghost:active{background:rgba(251,247,241,.08)}

/* 4 · who's at your table */
#s4.on{height:100dvh;flex:none}
#s4 .back{align-self:flex-start;padding:22px 26px 0;font-size:18px;line-height:1.3;color:var(--gold-dark);min-height:44px}
#s4 .thdr{padding:20px 26px 0;display:flex;align-items:center;gap:16px;flex:none}
#s4 .tile{width:64px;height:64px;border-radius:18px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;flex:none}
#s4 .tile.s{font-size:30px}
#s4 .ttl{font-family:var(--display);font-size:32px;line-height:1.1;color:var(--ink)}
#s4 .tsub{font-size:18px;line-height:1.35;color:var(--body);margin-top:2px}
#s4 .mates{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.mate{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--hair)}
.mate:last-child{border-bottom:0}
.mate .d{width:11px;height:11px;border-radius:50%;background:rgba(47,46,92,.2);flex:none}
.mate.me .d{background:var(--gold-dark)}
.mate .nm{font-size:21px;line-height:1.3;color:var(--ink)}
.mate .you{font-size:18px;color:var(--body)}

@media (max-height:560px){.num{font-size:clamp(110px,30vh,150px)}.num.s{margin:12px 0 8px}.pill{margin-top:12px}}
@media (max-width:339px){.hdr .names{font-size:30px}.lead h1 em{font-size:22px}.lead h1 span{font-size:36px}.lead p{font-size:17px}.field input{font-size:19px}.best .nm{font-size:24px}.best .sub,.alt .nm,.mate .nm{font-size:19px}.foot,.help{font-size:16px}#s4 .ttl{font-size:28px}}

/* room map sheet */
.sheet{position:fixed;inset:0;background:rgba(47,46,92,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s ease-out;z-index:10}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .panel{width:100%;max-height:96dvh;background:var(--cream);border-radius:32px 32px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;transform:translateY(24px);transition:transform .28s ease-out;overflow:hidden}
.sheet.on .panel{transform:none}
.sheet .handle{width:42px;height:4px;border-radius:2px;background:var(--hair-3);align-self:center}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;color:var(--ink)}
.sheet p{font-size:17px;line-height:1.5;color:var(--body)}
.sheet .map{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.sheet svg{height:min(72dvh,900px);width:auto;max-width:100%;display:block}
.sheet .close{height:56px;border:1.5px solid var(--hair-5);border-radius:16px;font-size:18px;color:var(--ink);width:100%}
svg .walls{fill:#fff;stroke:var(--hair-4);stroke-width:2}
svg .fx{fill:var(--sand-deep);stroke:none}
svg .dance{fill:var(--sand)}
svg .door{fill:var(--gold)}
svg .bar{stroke:var(--gold-light);stroke-width:10}
svg text.barlbl{font-family:var(--ui);font-size:20px;letter-spacing:.2em;text-transform:uppercase;fill:var(--gold)}
svg .tb.vendor{fill:var(--canvas);stroke-dasharray:6 4}
svg text.vendor{font-size:24px;fill:var(--label)}
svg .tb{fill:#fff;stroke:var(--hair-3);stroke-width:2}
svg .tb.me{fill:var(--gold);stroke:var(--gold)}
svg .ring{fill:none;stroke:var(--gold);stroke-width:4;opacity:.45}
svg text{font-family:var(--display);font-size:42px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
svg text.me{fill:var(--cream);font-weight:600}
svg text.lbl{font-family:var(--ui);font-size:22px;letter-spacing:.18em;text-transform:uppercase;fill:var(--label)}

</style>
</head>

<div class="app">

<section class="screen on" id="s1">
  <div class="band">
    <div class="hdr">
      <div class="eyebrow">12 September</div>

      <div class="rule"></div>

  </div>

  </div>
  
  <div class="foot">Can't find your name? Ask at the desk.</div>
</section>

<section class="screen" id="s2">
  <div class="field-wrap">

  </div>

    <button class="cta" id="cta" type="button">That's me — show my table</button>
  </div>
</section>

<section class="screen" id="s3">
  <div class="top"><div class="who" id="who"></div><button class="again" id="again" type="button">Search again</button></div>

    <div class="eyebrow" id="eyebrow">You're seated at table</div>

</section>

<section class="screen" id="s4">
  <button class="back" id="back" type="button">‹ Back</button>

    <div><div class="ttl" id="t4ttl"></div><div class="tsub" id="t4sub"></div></div>
  </div>
  <div class="mates" id="matelist"></div>
</section>


</div>

<div class="sheet" id="sheet" aria-hidden="true">

    <div class="handle"></div>
    <h2>The Grand Ballroom</h2>
    <div class="map"><svg id="map" viewBox="-905 170 700 1700" role="img" aria-label="Room map"></svg></div>
    <button class="close" id="closeSheet" type="button">Done</button>
  </div>
</div>

// ---------- matching ----------
const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
for (const g of DATA.guests) { g.f = fold(g.name); g.toks = g.f.split(' '); }
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function score(g, q, qt) {
  if (g.f === q) return 0;
  if (g.f.startsWith(q)) return 1;
  // every query token must prefix some name token
  if (qt.every(t => g.toks.some(n => n.startsWith(t)))) return 2;
  if (g.f.includes(q)) return 3;
  // fuzzy: each query token within a small edit distance of some name token
  const ok = qt.every(t => {
    if (t.length < 3) return g.toks.some(n => n.startsWith(t));
    const max = t.length >= 6 ? 2 : 1;
    return g.toks.some(n => n.startsWith(t) || lev(t, n, max) <= max || (n.length > t.length && lev(t, n.slice(0, t.length), max) <= max));
  });
  return ok ? 4 : -1;
}
function search(raw) {
  const q = fold(raw); if (q.length < 2) return [];
  const qt = q.split(' ');
  const out = [];
  for (const g of DATA.guests) { const s = score(g, q, qt); if (s >= 0) out.push([s, g]); }
  out.sort((a, b) => a[0] - b[0] || a[1].f.localeCompare(b[1].f));
  return out.slice(0, 7).map(x => x[1]);
}

const tnum = t => t === 'S' ? '♥' : String(t);

function renderList() {
  const box = $('#list'); box.innerHTML = '';
  $('#cta').hidden = matches.length === 0;
  $('#help').hidden = matches.length > 0;
  if (!matches.length) {
    const q = $('#q2').value.trim();
    box.innerHTML = q.length >= 2 ? '<div class="empty">No one by that name yet — try just a first or last name, or a different spelling.</div>' : '';
    return;
  }
  const [best, ...rest] = matches;
  const r = document.createElement('div'); r.className = 'results';
  r.innerHTML = '<div class="label">Closest match</div>';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'best';

  b.querySelector('.tile').textContent = tnum(best.t);
  b.querySelector('.nm').textContent = best.name;
  b.querySelector('.sub').textContent = tname(best.t);
  b.onclick = () => pick(best);
  r.appendChild(b); box.appendChild(r);

  if (rest.length) {
    const a = document.createElement('div'); a.className = 'alts';

      row.onclick = () => pick(g);
      a.appendChild(row);
    });
    box.appendChild(a);
  }
}

// The match card's name must stay on one line. Guest names here run to 38 characters, so step the
// size down (26 -> 20px) before giving up and letting it wrap; an ellipsis would hide the very
// part of the name that tells two Varghese families apart.
function fitName(el) {
  let size = 26; el.style.fontSize = ''; el.style.whiteSpace = '';
  while (el.scrollWidth > el.clientWidth && size > 20) { size -= 1; el.style.fontSize = size + 'px'; }
  if (el.scrollWidth > el.clientWidth) { el.style.whiteSpace = 'normal'; el.style.fontSize = '22px'; }
}

let timer = null;
function onType(v, from) {
  if (from === 'q1' && $('#q2').value !== v) $('#q2').value = v;
  if (from === 'q2' && $('#q1').value !== v) $('#q1').value = v;
  $('#f1').classList.toggle('has', v.length > 0); $('#f2').classList.toggle('has', v.length > 0);
  clearTimeout(timer);
  timer = setTimeout(() => {
    matches = search(v);

    else if (current === 's2') show('s1');
  }, 120);
}

function pick(g, silent) {
  selected = g;

  $('#who').textContent = g.name;
  const num = $('#num');
  num.className = 'num' + (g.t === 'S' ? ' s' : '');
  num.textContent = g.t === 'S' ? 'Sweetheart table' : String(g.t);
  $('#eyebrow').textContent = g.t === 'S' ? "You're seated at the" : "You're seated at table";
  document.activeElement && document.activeElement.blur();
  show('s3');
  if (!silent) {
    LS.set(KEY_LAST, {i: g.i, name: g.name, t: g.t, at: Date.now()});
    if (typeof onArrive === 'function') onArrive(g);
  }
  try { history.replaceState({s: 's3'}, '', '#g=' + g.i); } catch(e){}
}

function renderMates(g) {
  const tb = T.get(String(g.t));
  const all = DATA.guests.filter(x => String(x.t) === String(g.t)).sort((a, b) => a.i - b.i);
  const mates = [g, ...all.filter(x => x.i !== g.i)];
  const tile = $('#t4tile'); tile.className = 'tile' + (g.t === 'S' ? ' s' : ''); tile.textContent = tnum(g.t);

  $('#t4sub').textContent = cap(words(mates.length)) + ' of you, ' + tb.short;
  const list = $('#matelist'); list.innerHTML = '';

    const row = document.createElement('div'); row.className = 'mate' + (x.i === g.i ? ' me' : '');

// ---------- room map ----------
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, txt) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
let mapBuilt = false;
function buildMap() {
  const svg = $('#map'); svg.innerHTML = '';
  const g = el('g', {transform: 'rotate(90)'}); svg.appendChild(g);
  g.appendChild(el('polygon', {class: 'walls', points: WALLS}));
  g.appendChild(el('rect', {class: 'dance', x: 790, y: 500, width: 480, height: 200, rx: 6}));
  g.appendChild(el('rect', {class: 'fx', x: 955, y: 370, width: 170, height: 85, rx: 4}));
  g.appendChild(el('rect', {class: 'fx', x: 1005, y: 740, width: 190, height: 95, rx: 4}));
  const up = (x, y) => 'rotate(-90 ' + x + ' ' + y + ')';
  // doors to the hallway, stairs and elevator sit in the back wall beside the DJ
  g.appendChild(el('rect', {class: 'door', x: 780, y: 852, width: 200, height: 12, rx: 3}));
  [[1030, 600, 'Dance floor'], [1040, 412, 'Stage'], [1100, 787, 'DJ'], [880, 778, 'Entrance']]
    .forEach(([x, y, t]) => g.appendChild(el('text', {class: 'lbl', x, y, transform: up(x, y)}, t)));
  g.appendChild(el('text', {class: 'lbl', x: 1762, y: 843, style: 'font-size:16px'}, 'Service door'));   // reads along the back wall
  // bars: on the flat run of each side wall (between 43 & 45, and between 34 & 32) and along the entrance wall by 7 & 9
  [[185, 500, 185, 630, 203, 565], [1830, 520, 1830, 650, 1800, 585], [560, 856, 750, 856, 655, 882]]
    .forEach(([x1, y1, x2, y2, lx, ly]) => { g.appendChild(el('line', {class: 'bar', x1, y1, x2, y2})); g.appendChild(el('text', {class: 'barlbl', x: lx, y: ly, transform: up(lx, ly)}, 'Bar')); });
  // vendor table in the far-left corner
  g.appendChild(el('circle', {class: 'tb vendor', cx: 265, cy: 730, r: 30}));
  g.appendChild(el('text', {class: 'vendor', x: 265, y: 730, transform: up(265, 730)}, 'V'));
  DATA.tables.forEach(t => {
    const me = selected && String(selected.t) === String(t.id);
    if (t.id === 'S') {
      g.appendChild(el('circle', {class: 'tb' + (me ? ' me' : ''), cx: t.x, cy: t.y, r: 26}));
      if (me) g.appendChild(el('circle', {class: 'ring', cx: t.x, cy: t.y, r: 40}));
      g.appendChild(el('text', {class: me ? 'me' : '', x: t.x, y: t.y, transform: up(t.x, t.y), style: 'font-size:26px'}, '♥'));
      return;
    }
    g.appendChild(el('circle', {class: 'tb' + (me ? ' me' : ''), cx: t.x, cy: t.y, r: 44}));
    if (me) g.appendChild(el('circle', {class: 'ring', cx: t.x, cy: t.y, r: 58}));
    g.appendChild(el('text', {class: me ? 'me' : '', x: t.x, y: t.y, transform: up(t.x, t.y)}, String(t.id)));
  });
}
function openSheet() {
  buildMap();
  $('#sheet').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheet').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
$('#room').addEventListener('click', openSheet);
$('#closeSheet').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) closeSheet(); });
let ty = null;
$('#sheet .panel').addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive: true});
$('#sheet .panel').addEventListener('touchend', e => { if (ty != null && e.changedTouches[0].clientY - ty > 80 && $('#sheet .map').scrollTop === 0) closeSheet(); ty = null; }, {passive: true});



// The couple's names stay on one line in the header band (34px max, per the handoff).
(function fitNames() {
  const el = $('#names'); if (!el) return;
  const run = () => { let size = 34; el.style.fontSize = ''; while (el.scrollWidth > el.clientWidth && size > 24) { size -= 1; el.style.fontSize = size + 'px'; } };
  run(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(run); window.addEventListener('resize', run);
})();

// ---------- boot ----------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
(function boot() {
  if (window.coupleMode) return;
  const m = /[#&]g=(\d+)/.exec(location.hash);
  const wantMap = /[#&]map\b/.test(location.hash);
  const wantWho = /[#&]who\b/.test(location.hash);
  if (m && G.has(+m[1])) { pick(G.get(+m[1]), true); if (wantMap) openSheet(); else if (wantWho) { renderMates(selected); show('s4'); } return; }
  const qm = /[#&]q=([^&]+)/.exec(location.hash);
  if (qm) { const v = decodeURIComponent(qm[1]); $('#q1').value = v; onType(v, 'q1'); return; }
  const last = LS.get(KEY_LAST);
  if (last && G.has(last.i)) { pick(G.get(last.i), true); return; }
})();
</script>
</body>
